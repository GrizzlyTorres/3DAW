<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <title>Criar Pergunta - Texto</title>
<body>
    <h2>Criar Pergunta - Texto</h2>
    <form action="../php/processa_texto.php" method="post">
        
        <label>Id:</label><br>
        <input type="text" name="id" size="50" required><br><br>
        <label>Pergunta Situacional:</label><br>
        <textarea name="pergunta" rows="4" cols="50" required></textarea><br><br>
        
        <label>Resposta/Decisão Esperada:</label><br>
        <textarea name="resposta" rows="4" cols="50" required></textarea><br><br>
        
        <button type="submit">Salvar Pergunta</button>
    </form>
</body>
</html>
