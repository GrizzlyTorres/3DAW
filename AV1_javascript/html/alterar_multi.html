<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Alterar Pergunta - Múltipla Escolha</title>
</head>
<body>
    <h2>Alterar Pergunta - Múltipla Escolha</h2>
    <form id="formAlterarMulti">
        <label>ID da Pergunta a alterar:</label><br>
        <input type="text" id="id" size="50" required><br><br>
        
        <label>Nova Pergunta:</label><br>
        <input type="text" id="pergunta" size="50" required><br><br>
        
        <label>Nova Opção A:</label> <input type="text" id="opcaoA" required><br>
        <label>Nova Opção B:</label> <input type="text" id="opcaoB" required><br>
        <label>Nova Opção C:</label> <input type="text" id="opcaoC" required><br>
        <label>Nova Opção D:</label> <input type="text" id="opcaoD" required><br>
        <label>Nova Opção E:</label> <input type="text" id="opcaoE" required><br><br>

        <label>Nova Resposta Correta:</label><br>
        <input type="radio" name="correta" value="A"> Opção A <br>
        <input type="radio" name="correta" value="B"> Opção B <br>
        <input type="radio" name="correta" value="C"> Opção C <br>
        <input type="radio" name="correta" value="D"> Opção D <br>
        <input type="radio" name="correta" value="E"> Opção E <br><br>
        
        <button type="button" onclick="alterarPerguntaMulti()">Salvar Alteração</button>
    </form>
    
    <p id="mensagem"></p>

    <script src="../js/alterar_multi.js"></script>
</body>
</html>
