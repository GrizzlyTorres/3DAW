<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Criar Pergunta - Texto</title>
</head>
<body>
    <h2>Criar Pergunta - Texto</h2>
    <form id="formTexto">
        <label>Id:</label><br>
        <input type="text" id="id" size="50" required><br><br>
        
        <label>Pergunta Situacional:</label><br>
        <textarea id="pergunta" rows="4" cols="50" required></textarea><br><br>
        
        <label>Resposta/Decisão Esperada:</label><br>
        <textarea id="resposta" rows="4" cols="50" required></textarea><br><br>
        
        <button type="button" onclick="salvarPerguntaTexto()">Salvar Pergunta</button>
    </form>
    
    <p id="mensagem"></p>

    <script src="../js/criar_texto.js"></script>
</body>
</html>
