<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Alterar Pergunta - Texto</title>
</head>
<body>
    <h2>Alterar Pergunta - Texto</h2>
    <form id="formAlterarTexto">
        <label>ID da Pergunta a alterar:</label><br>
        <input type="text" id="id" size="50" required><br><br>

        <label>Nova Pergunta Situacional:</label><br>
        <textarea id="pergunta" rows="4" cols="50" required></textarea><br><br>
        
        <label>Nova Resposta/Decisão Esperada:</label><br>
        <textarea id="resposta" rows="4" cols="50" required></textarea><br><br>
        
        <button type="button" onclick="alterarPerguntaTexto()">Salvar Alteração</button>
    </form>

    <p id="mensagem"></p>

    <script>
        function alterarPerguntaTexto() {
            let id = document.getElementById('id').value;
            let pergunta = document.getElementById('pergunta').value;
            let resposta = document.getElementById('resposta').value;
            let msgBox = document.getElementById('mensagem');

            if (id.trim() === "" || pergunta.trim() === "" || resposta.trim() === "") {
                msgBox.innerHTML = "<span style='color: red;'>Todos os campos devem ser preenchidos!</span>";
                return;
            }

            let dadosTexto = {
                id: id,
                pergunta: pergunta,
                resposta: resposta
            };

            let xhr = new XMLHttpRequest();
            xhr.open("PUT", "http://localhost:3000/perguntas_texto/" + encodeURIComponent(id), true);
            xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 204) {
                        msgBox.innerHTML = "<span style='color: green;'>Pergunta alterada com sucesso!</span>";
                        document.getElementById("formAlterarTexto").reset();
                    } else {
                        msgBox.innerHTML = "<span style='color: red;'>Erro ao alterar: " + xhr.status + "</span>";
                    }
                }
            };

            xhr.send(JSON.stringify(dadosTexto));
        }
    </script>
</body>
</html>
